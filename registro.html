<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Veterinaria San Marcos</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js"></script>
</head>

<body>
    <main class="login-container">
        <section class="login-box" aria-labelledby="registerTitle">
            <header class="login-header">
                <h1 id="registerTitle">🐾 Crear una cuenta</h1>
                <p>Regístrate en Veterinaria San Marcos</p>
            </header>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="firstName">Nombres</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Tus nombres" autocomplete="given-name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Apellidos</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Tus apellidos" autocomplete="family-name" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Correo electrónico</label>
                    <input type="email" id="registerEmail" name="email" placeholder="tu@email.com" autocomplete="email" required>
                    <span class="error-message" id="registerEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Número de teléfono</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ej. 987 654 321" autocomplete="tel" inputmode="tel" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Contraseña</label>
                    <input type="password" id="registerPassword" name="password" placeholder="Ej. SanMarcos1!" autocomplete="new-password" minlength="6" pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s]).{6,}" title="Usa al menos 6 caracteres, una mayúscula, un número y un carácter especial." required>
                    <span class="error-message" id="registerPasswordError"></span>
                </div>

                <button type="submit" class="btn-login">Crear cuenta</button>
            </form>

            <footer class="login-footer">
                <a class="home-button" href="index.html">← Volver al inicio</a>
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </footer>
        </section>
    </main>
</body>

</html>
