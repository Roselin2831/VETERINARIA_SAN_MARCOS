server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resuelve el nombre "backend" con el DNS interno de Docker en cada petición,
    # así Nginx arranca aunque la API todavía no esté lista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # API Spring Boot: el navegador llama a http://<IP>/api/... (mismo origen, sin CORS)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # Swagger también queda disponible por el puerto 80
    location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
